# First source of the fleet. Response field shape (id, downloads,
# downloadsAllTime, likes, createdAt, lastModified via expand[]) was verified
# against the live API on 2026-08-31. Still: run
#     wss doctor hf.models.text-generation
# and read the raw response yourself before flipping status to active —
# see "Before enabling" in README.md.
source_id: hf.models.text-generation
status: active
cadence: weekly
schema_id: adoption.v1

publisher: Hugging Face
publisher_tier: first_party
# The public API exposes only `downloads` (rolling last-30-days) and
# `downloadsAllTime` (running total) — no historical breakdown. Month-by-month
# history is enterprise-only and limited to an org's own assets. Every
# uncaptured day is permanently gone.
destroys_own_history: true
licence: "Hub metadata via public API; see https://huggingface.co/terms-of-service"
personal_data: none
storage: git

endpoints:
  - url: "https://huggingface.co/api/models?pipeline_tag=text-generation&sort=downloads&direction=-1&limit=1000&expand[]=downloads&expand[]=downloadsAllTime&expand[]=likes&expand[]=createdAt&expand[]=lastModified"
    delay_seconds: 2

gates:
  expect_status: 200
  min_bytes: 1000
  content_type_any: [json]
  must_contain: ["downloads"]
  must_not_contain: ["Access Denied"]
  # 50%: derived from observed volatility, not taste. Across the fleet's
  # manifest history no source has ever shrunk more than 2.3% between
  # captures, so 50 is ~20x the worst real movement while still catching
  # truncation. Set high on purpose: the baseline is the LAST SUCCESSFUL
  # capture, so a gate that fires on a legitimate change keeps firing
  # forever against a size the publisher has moved on from, and every
  # capture in between is lost. Capture must not fail; health flags an
  # odd source AFTER the bytes are safely stored.
  max_shrink_pct: 50