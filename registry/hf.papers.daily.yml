# Field shape verified against the live API on 2026-08-31 (see git history).
source_id: hf.papers.daily
status: active
cadence: weekly
schema_id: papers.v1

publisher: Hugging Face
publisher_tier: first_party
destroys_own_history: true   # rolling windows and running totals only; no history endpoint
licence: "Hub metadata via public API; see https://huggingface.co/terms-of-service"
personal_data: none
storage: git

notes: >-
  Interest 5: the curated daily-papers feed with community upvotes/comments. Upvote trajectories across captures + the arxiv tags in hf.models.top-downloads let us ask which papers were overrated (upvotes, no model adoption) or underrated (the reverse).

endpoints:
  - url: "https://huggingface.co/api/daily_papers?limit=100"
    delay_seconds: 2

gates:
  expect_status: 200
  min_bytes: 1000
  content_type_any: [json]
  must_contain: ["upvotes"]
  must_not_contain: ["Access Denied"]
  # 50%: derived from observed volatility, not taste. Across the fleet's
  # manifest history no source has ever shrunk more than 2.3% between
  # captures, so 50 is ~20x the worst real movement while still catching
  # truncation. Set high on purpose: the baseline is the LAST SUCCESSFUL
  # capture, so a gate that fires on a legitimate change keeps firing
  # forever against a size the publisher has moved on from, and every
  # capture in between is lost. Capture must not fail; health flags an
  # odd source AFTER the bytes are safely stored.
  max_shrink_pct: 50